# =============================================================================
# Docker CI — remote build + runtime validation of the Propel single image
# =============================================================================
# Builds deploy/Dockerfile (the real production image) on GitHub runners and
# then boots the full stack through the real compose file
# (deploy/docker-compose.yml — the same one friends use) and runs the runtime
# smoke-test suite scripts/ci/test-docker-stack.sh — the SAME suite developers
# run locally, covering: container health, gateway + backend + agents +
# nginx endpoints, gateway→backend YARP proxying with auth enforcement (401),
# Keycloak realm issuer, EF migrations applied, sidecar LLM catalog + LaTeX
# capability degradation, and no supervisor restart loops.
# Dedup with Monolith CI: this workflow does the container build; dotnet-based
# compile checks remain in monolith-ci.yml.
#
# Registry: after a green validation cycle, branch pushes publish the image to
# Docker Hub (secrets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN): main → :latest,
# dev → :dev, both also → :<short-sha>. PRs and ci/docker-image don't publish.
# Cache: BuildKit layers via type=gha (mode=max); RUN-level dependency caches
# (nuget shared between stages, npm, pip) are BuildKit cache mounts in the
# Dockerfile.
# =============================================================================

name: Docker CI

on:
  push:
    branches: [main, dev, ci/docker-image]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/bilal/**"
      - "deploy/nourelhouda/**"
      - "deploy/somia/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      build_full:
        description: "Also build the texlive :full variant (propel:full)"
        type: boolean
        default: false
      run_tests:
        description: "Run the compose runtime validation after the build"
        type: boolean
        default: true

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE: docker compose -f deploy/docker-compose.yml

jobs:
  docker:
    name: Build + runtime validation
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build propel:latest (default, texlive-less)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: propel:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build propel:full (texlive) — optional
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_full }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: propel:full
          build-args: WITH_LATEX=true
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Image validation ───────────────────────────────────────────────────
      - name: Inspect image
        run: |
          docker image ls propel
          SIZE=$(docker image inspect propel:latest --format '{{.Size}}')
          echo "propel:latest size: $SIZE bytes ($((SIZE / 1024 / 1024)) MiB)"
          docker image inspect propel:latest \
            --format 'entrypoint={{json .Config.Entrypoint}} exposes={{json .Config.ExposedPorts}}'
          test "$SIZE" -gt 0 || { echo "propel:latest missing/empty"; exit 1; }

      # ── Runtime validation (real compose stack) ────────────────────────────
      - name: Start the compose stack (app + postgres + keycloak + minio)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          ${{ env.COMPOSE }} up -d --no-build --wait --wait-timeout 300
          ${{ env.COMPOSE }} ps

      - name: Wait for gateway readiness
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "gateway healthy after $i probe(s)"; exit 0
            fi
            sleep 5
          done
          echo "gateway did not become healthy in 5 minutes" >&2
          ${{ env.COMPOSE }} logs app --tail 200 || true
          exit 1

      # The runtime test suite lives in scripts/ci/test-docker-stack.sh — the
      # same suite developers run locally against their own stack, so local
      # results and CI results are identical (one source of truth).
      - name: Run runtime test suite (scripts/ci/test-docker-stack.sh)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: bash scripts/ci/test-docker-stack.sh

      # ── Diagnostics (never lose the logs to a failing teardown) ─────────────
      - name: Collect diagnostics
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_tests) }}
        run: |
          {
            echo "── compose ps ──────────────────────────"
            ${{ env.COMPOSE }} ps || true
            echo "── app logs (last 500) ─────────────────"
            ${{ env.COMPOSE }} logs app --tail 500 || true
            echo "── supervisor program logs ──"
            docker exec propel-app sh -c 'for f in /var/log/supervisor/*.log; do echo "== $f"; tail -300 "$f"; done' | head -1500
            echo "── keycloak (last 100) ─────────────────"
            ${{ env.COMPOSE }} logs keycloak --tail 100 || true
          } | sed -E 's/(Password|PASSWORD|api_key|API_KEY|SECRET|token)=[^ ;">]+/\1=[REDACTED]/gi' > docker-diagnostics.txt
          docker inspect propel-app --format '{{json .State}}' > propel-app-state.json || true

      - name: Upload diagnostics artifact
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_tests) }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-diagnostics
          path: |
            docker-diagnostics.txt
            propel-app-state.json
          retention-days: 7


      - name: Shutdown the stack
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_tests) }}
        run: ${{ env.COMPOSE }} down -v --remove-orphans || true

      # ── Publish the validated image to Docker Hub ───────────────────────────
      # Runs only after the full cycle above succeeded on a real branch push
      # (never on PRs / ci/docker-image). main → :latest + :sha, dev → :dev + :sha
      - name: Push image to Docker Hub
        if: ${{ success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          for i in $(seq 1 3); do
            if echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then break; fi
            if [ "$i" = 3 ]; then echo "docker hub login failed after 3 attempts" >&2; exit 1; fi
            sleep 10
          done

          HUB_IMAGE="$DOCKERHUB_USERNAME/propel"
          SHORT_SHA="$(git rev-parse --short HEAD)"

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            docker tag propel:latest "$HUB_IMAGE:latest"
            docker push "$HUB_IMAGE:latest"
          else
            docker tag propel:latest "$HUB_IMAGE:dev"
            docker push "$HUB_IMAGE:dev"
          fi
          docker tag propel:latest "$HUB_IMAGE:$SHORT_SHA"
          docker push "$HUB_IMAGE:$SHORT_SHA"
          echo "published: $HUB_IMAGE ($GITHUB_REF_NAME)"
