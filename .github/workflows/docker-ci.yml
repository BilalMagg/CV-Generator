# =============================================================================
# Docker CI — remote build + runtime validation of the Propel single image
# =============================================================================
# Builds deploy/Dockerfile (the real production image) on GitHub runners and
# then boots the full stack through the real compose file
# (deploy/docker-compose.yml — the same one friends use) and validates:
#   - image metadata/size
#   - every service turns healthy (postgres / keycloak / minio / app)
#   - gateway + backend + agents + nginx health endpoints
#   - gateway→backend YARP proxying with auth enforcement (401 unauth)
#   - Keycloak realm (sign-up enabled) issuer document
#   - EF Core migrations actually ran (migrations history rows > 0)
#   - sidecar LLM catalog + LaTeX capability probing (a texlive-less default
#     image must degrade cleanly, not crash)
# Dedup with Monolith CI: this workflow does the container build; dotnet-based
# compile checks remain in monolith-ci.yml.
#
# No registry is required — images are built and tested on the runner only.
# Cache: BuildKit layers via type=gha (mode=max); RUN-level dependency caches
# (nuget shared between stages, npm, pip) are BuildKit cache mounts in the
# Dockerfile.
# =============================================================================

name: Docker CI

on:
  push:
    branches: [main, dev, ci/docker-image]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "deploy/bilal/**"
      - "deploy/nourelhouda/**"
      - "deploy/somia/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      build_full:
        description: "Also build the texlive :full variant (propel:full)"
        type: boolean
        default: false
      run_tests:
        description: "Run the compose runtime validation after the build"
        type: boolean
        default: true

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE: docker compose -f deploy/docker-compose.yml

jobs:
  docker:
    name: Build + runtime validation
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build propel:latest (default, texlive-less)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: propel:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build propel:full (texlive) — optional
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_full }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: propel:full
          build-args: WITH_LATEX=true
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Image validation ───────────────────────────────────────────────────
      - name: Inspect image
        run: |
          docker image ls propel
          SIZE=$(docker image inspect propel:latest --format '{{.Size}}')
          echo "propel:latest size: $SIZE bytes ($((SIZE / 1024 / 1024)) MiB)"
          docker image inspect propel:latest \
            --format 'entrypoint={{json .Config.Entrypoint}} exposes={{json .Config.ExposedPorts}}'
          test "$SIZE" -gt 0 || { echo "propel:latest missing/empty"; exit 1; }

      # ── Runtime validation (real compose stack) ────────────────────────────
      - name: Start the compose stack (app + postgres + keycloak + minio)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          ${{ env.COMPOSE }} up -d --no-build --wait --wait-timeout 300
          ${{ env.COMPOSE }} ps

      - name: Wait for gateway readiness
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "gateway healthy after $i probe(s)"; exit 0
            fi
            sleep 5
          done
          echo "gateway did not become healthy in 5 minutes" >&2
          ${{ env.COMPOSE }} logs app --tail 200 || true
          exit 1

      - name: Check — all services running/healthy
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          fail=0
          for c in propel-postgres propel-keycloak-db propel-minio propel-keycloak; do
            st=$(docker inspect "$c" --format '{{.State.Health.Status}}')
            echo "$c health: $st"
            [ "$st" = "healthy" ] || fail=1
          done
          st=$(docker inspect propel-app --format '{{.State.Status}}')
          echo "propel-app state: $st"
          [ "$st" = "running" ] || fail=1
          exit $fail

      - name: Check — backend health (in-container :5000)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          out=$(docker exec propel-app curl -fsS http://localhost:5000/health)
          echo "$out"
          echo "$out" | grep -q '"status":"ok"' || { echo "backend health mismatch"; exit 1; }

      - name: Check — agents sidecar health + LLM catalog + latex capabilities
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          out=$(docker exec propel-app curl -fsS http://localhost:8000/health)
          echo "$out"
          echo "$out" | grep -q '"status":"ok"' || { echo "sidecar health mismatch"; exit 1; }
          out=$(docker exec propel-app curl -fsS http://localhost:8000/api/llm/providers)
          echo "$out"
          echo "$out" | grep -q '"providers"' || { echo "llm catalog mismatch"; exit 1; }
          out=$(docker exec propel-app curl -fsS http://localhost:8000/api/agents/pdf/capabilities)
          echo "$out"
          # a texlive-less default image must degrade CLEANLY (not 500): text PDF
          # stays available, latex reports engine=null
          echo "$out" | grep -q '"text_pdf_available":true' || { echo "text_pdf probe failed"; exit 1; }

      - name: Check — MinIO reachable from the app container
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: docker exec propel-app curl -fsS http://minio:9000/minio/health/live

      - name: Check — database reachable + EF migrations ran
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          ${{ env.COMPOSE }} exec -T postgres pg_isready -U postgres -d cv_monolith
          # migrations run at backend STARTUP on a cold DB (60+ migrations +
          # data-SQL) and can take a while; the check polls instead of racing
          ok=""
          for i in $(seq 1 40); do
            n=$(${{ env.COMPOSE }} exec -T postgres \
              psql -U postgres -d cv_monolith -tAc "select count(*) from \"__EFMigrationsHistory\"")
            echo "attempt $i: migration history rows: $n"
            if [ "${n:-0}" -gt 0 ]; then ok=1; break; fi
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "migrations did not complete in 200s — dumping diagnostics"
            echo "── existing tables ──"
            ${{ env.COMPOSE }} exec -T postgres psql -U postgres -d cv_monolith -tAc \
              "select tablename from pg_tables where schemaname='public' order by 1"
            echo "── backend log: migration/startup/error lines ──"
            docker exec propel-app sh -c \
              'grep -iE "migrat|now listening|migration failed|exception|error" /var/log/supervisor/backend.log | head -80' || true
            exit 1
          fi

      - name: Check — Keycloak realm imported (sign-up enabled)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          out=$(curl -fsS http://localhost:9090/realms/cv-realm/.well-known/openid-configuration)
          echo "$out" | grep -q '"issuer"' || { echo "keycloak realm not ready"; exit 1; }

      - name: Check — frontend SPA served with API proxy config
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          out=$(curl -fsS http://localhost:4200)
          echo "$out" | grep -q '<app-root' || { echo "SPA index not served"; exit 1; }

      - name: Check — gateway proxies /api to the backend and enforces auth
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/llm-settings)
          echo "GET /api/llm-settings without auth -> $code"
          [ "$code" = "401" ] || { echo "expected 401 auth enforcement, got $code"; exit 1; }

      # ── Diagnostics (never lose the logs to a failing teardown) ─────────────
      - name: Collect diagnostics
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_tests) }}
        run: |
          {
            echo "── compose ps ──────────────────────────"
            ${{ env.COMPOSE }} ps || true
            echo "── app logs (last 500) ─────────────────"
            ${{ env.COMPOSE }} logs app --tail 500 || true
            echo "── supervisor program logs ──"
            docker exec propel-app sh -c 'for f in /var/log/supervisor/*.log; do echo "== $f"; tail -300 "$f"; done' | head -1500
            echo "── keycloak (last 100) ─────────────────"
            ${{ env.COMPOSE }} logs keycloak --tail 100 || true
          } | sed -E 's/(Password|PASSWORD|api_key|API_KEY|SECRET|token)=[^ ;">]+/\1=[REDACTED]/gi' > docker-diagnostics.txt
          docker inspect propel-app --format '{{json .State}}' > propel-app-state.json || true

      - name: Upload diagnostics artifact
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_tests) }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-diagnostics
          path: |
            docker-diagnostics.txt
            propel-app-state.json
          retention-days: 7


      - name: Shutdown the stack
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.run_tests) }}
        run: ${{ env.COMPOSE }} down -v --remove-orphans || true
