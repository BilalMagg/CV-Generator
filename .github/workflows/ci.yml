name: CI

on:
  push:
    branches: [main, develop, feature/ci-2]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read
  security-events: write
  packages: write

jobs:

  # ═══════════════════════════════════════════════════════════
  # PHASE 1 — STATIC CHECKS
  # ═══════════════════════════════════════════════════════════

  compose-validate:
    name: Validate Compose Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder .env files for CI
        run: |
          for dir in ai_agents/services/*/; do
            touch "$dir.env"
          done
          touch backend/src/notification-service/.env
      - name: Validate Docker Compose files
        run: |
          docker compose config --quiet
          docker compose -f backend/docker-compose.yml config --quiet
          docker compose -f api_gateway/docker-compose.yml config --quiet
          docker compose -f ai_agents/docker-compose.yml config --quiet

  trivy-fs:
    name: Security - Trivy (Filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs
          token: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud-frontend:
    name: Quality - SonarCloud (Frontend)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: frontend
          projectKey: cv-generator-frontend
          organization: Nour1902
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  sonarcloud-backend:
    name: Quality - SonarCloud (Backend)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Setup Java (required by sonarscanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Begin SonarCloud scan
        run: |
          dotnet sonarscanner begin \
            /k:cv-generator-backend \
            /o:Nour1902 \
            /d:sonar.host.url=https://sonarcloud.io \
            /d:sonar.token=${{ secrets.SONAR_TOKEN }}
      - name: Build backend
        run: dotnet build CV_Generator.sln
      - name: End SonarCloud scan
        run: dotnet sonarscanner end /d:sonar.token=${{ secrets.SONAR_TOKEN }}

  sonarcloud-ai:
    name: Quality - SonarCloud (AI Agents)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: ai_agents
          projectKey: cv-generator-ai
          organization: Nour1902
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ═══════════════════════════════════════════════════════════
  # PHASE 2 — COMPONENT TESTS
  # ═══════════════════════════════════════════════════════════

  backend-tests:
    name: Tests - Backend (.NET)
    runs-on: ubuntu-latest
    needs: [trivy-fs, compose-validate]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore backend/tests/ApplicationService.Tests
      - name: Build
        run: dotnet build --no-restore -c Release backend/tests/ApplicationService.Tests
      - name: Run tests
        run: |
          dotnet test backend/tests/ApplicationService.Tests -c Release --no-build --verbosity normal

  frontend-tests:
    name: Tests - Frontend (Angular)
    runs-on: ubuntu-latest
    needs: [trivy-fs, compose-validate]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx ng test --no-watch

  ai-agents-tests:
    name: Tests - AI Agents (Python)
    runs-on: ubuntu-latest
    needs: [trivy-fs, compose-validate]
    defaults:
      run:
        working-directory: ai_agents
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ai_agents/**/requirements.txt', 'ai_agents/**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install service dependencies
        run: |
          for dir in services/*/; do
            if [ -f "$dir/requirements.txt" ]; then
              pip install -r "$dir/requirements.txt" --quiet
            fi
          done
          pip install -e services/common-tools[dev] --quiet
      - name: Run Python tests
        run: |
          cd services/common-tools && python -m pytest test_pdf_tools.py -v --tb=short || true
          cd ../contact-agent && python run_test.py || true

  # ═══════════════════════════════════════════════════════════
  # PHASE 3 — INTEGRATION (native, no Docker images needed)
  # ═══════════════════════════════════════════════════════════

  e2e-tests:
    name: E2E Tests - Cypress
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, ai-agents-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create placeholder .env files
        run: |
          for dir in ai_agents/services/*/; do
            touch "$dir.env"
          done
          touch backend/src/notification-service/.env

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Start infrastructure (Docker)
        run: |
          docker compose -f backend/docker-compose.yml up -d \
            kafka schema-registry kafka-ui \
            user-db content-db workflow-db application-db \
            job-offer-db notification-db cv-db
          docker compose -f api_gateway/docker-compose.yml up -d keycloak-db keycloak

      - name: Restore .NET projects
        run: |
          for project in api_gateway backend/src/user-service backend/src/user-content-service \
                         backend/src/workflow-service backend/src/application-service \
                         backend/src/job-offer-service backend/src/notification-service \
                         backend/src/cv-service; do
            dotnet restore "$project"
          done

      - name: Build .NET projects
        run: |
          for project in api_gateway backend/src/user-service backend/src/user-content-service \
                         backend/src/workflow-service backend/src/application-service \
                         backend/src/job-offer-service backend/src/notification-service \
                         backend/src/cv-service; do
            dotnet build --no-restore -c Release "$project"
          done

      - name: Start backend services
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_AUTHORITY: http://localhost:9090/realms/cv-realm
        run: |
          for pair in \
            "backend/src/user-service 8082" \
            "backend/src/user-content-service 8083" \
            "backend/src/workflow-service 8084" \
            "backend/src/application-service 8085" \
            "backend/src/job-offer-service 8086" \
            "backend/src/notification-service 8087" \
            "backend/src/cv-service 8088"; do
            project=$(echo "$pair" | awk '{print $1}')
            port=$(echo "$pair" | awk '{print $2}')
            dotnet run --project "$project" --no-build -c Release \
              --urls "http://0.0.0.0:$port" &
            echo "Started $project on :$port"
          done

      - name: Start API Gateway
        env:
          USER_SERVICE_URL: http://localhost:8082
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          KEYCLOAK_INTERNAL_URL: http://localhost:9090
          KEYCLOAK_EXTERNAL_URL: http://localhost:9090
          GATEWAY_URL: http://localhost:8080
          FRONTEND_URL: http://localhost:4200
          KEYCLOAK_REALM: cv-realm
          KEYCLOAK_CLIENT_ID: cv-gateway
          KEYCLOAK_CLIENT_SECRET: change-me-in-production
        run: |
          dotnet run --project api_gateway --no-build -c Release \
            --urls "http://0.0.0.0:8080" &

      - name: Start frontend
        run: |
          npx ng serve --configuration=production &
        working-directory: frontend

      - name: Wait for all services
        run: |
          # Gateway
          for i in $(seq 1 30); do
            sleep 5
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health 2>/dev/null || echo "000")
            [ "$code" = "200" ] && echo "Gateway healthy" && break
            echo "Attempt $i - Gateway: $code"
          done
          # Frontend
          for i in $(seq 1 20); do
            sleep 3
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 2>/dev/null || echo "000")
            [ "$code" = "200" ] && echo "Frontend healthy" && break
            echo "Attempt $i - Frontend: $code"
          done

      - name: Cypress E2E
        run: npx cypress run --e2e --browser electron --headless
        working-directory: frontend

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/screenshots/
            frontend/cypress/videos/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose -f backend/docker-compose.yml -f api_gateway/docker-compose.yml down -v

  zap-scan:
    name: Security - ZAP Scan
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, ai-agents-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Create placeholder .env files
        run: |
          for dir in ai_agents/services/*/; do
            touch "$dir.env"
          done
          touch backend/src/notification-service/.env

      - name: Start Keycloak
        run: docker compose -f api_gateway/docker-compose.yml up -d keycloak-db keycloak

      - name: Restore .NET projects
        run: dotnet restore api_gateway

      - name: Build API Gateway
        run: dotnet build --no-restore -c Release api_gateway

      - name: Start API Gateway
        env:
          KEYCLOAK_INTERNAL_URL: http://localhost:9090
          KEYCLOAK_EXTERNAL_URL: http://localhost:9090
          GATEWAY_URL: http://localhost:8080
          FRONTEND_URL: http://localhost:4200
        run: |
          dotnet run --project api_gateway --no-build -c Release \
            --urls "http://0.0.0.0:8080" &
          for i in $(seq 1 20); do
            sleep 3
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health 2>/dev/null || echo "000")
            [ "$code" = "200" ] && echo "Gateway healthy" && break
            echo "Attempt $i - Gateway: $code"
          done

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080"
          cmd_options: "-a -j"
          allow_issue_writing: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_json.json
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose -f api_gateway/docker-compose.yml down -v

  # ═══════════════════════════════════════════════════════════
  # PHASE 4 — BUILD + SCAN (Docker images, only on main/ci)
  # ═══════════════════════════════════════════════════════════

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [e2e-tests, zap-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-2'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create placeholder .env files
        run: |
          for dir in ai_agents/services/*/; do
            touch "$dir.env"
          done
          touch backend/src/notification-service/.env
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build all images
        env:
          DOCKER_BUILDKIT: 1
        run: docker compose build
      - name: Push images to GHCR
        run: |
          REPO=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for image in $(docker images "cv-*" --format "{{.Repository}}" | sort -u); do
            service="${image#cv-}"
            ghcr_image="ghcr.io/${REPO}/cv-${service}:${{ github.sha }}"
            docker tag "$image" "$ghcr_image"
            docker push "$ghcr_image"
            echo "Pushed $ghcr_image"
          done

  trivy-image:
    name: Security - Trivy (Images)
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull and retag images from GHCR
        run: |
          REPO=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for service in frontend user-service cv-service user-content-service \
                         api-gateway notification-service application-service \
                         job-offer-service workflow-service contact-agent \
                         job-extractor cv-optimizer job-crawler search-agent \
                         template-agent; do
            ghcr_image="ghcr.io/${REPO}/cv-${service}:${{ github.sha }}"
            docker pull "$ghcr_image"
            docker tag "$ghcr_image" "cv-${service}"
          done
      - name: Scan built images
        run: |
          mkdir -p reports
          for img in $(docker images "cv-*" --format "{{.Repository}}"); do
            service="${img#cv-}"
            echo "Scanning: $img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${{ github.workspace }}/reports:/reports" \
              aquasec/trivy:latest image --severity HIGH,CRITICAL \
              --exit-code 0 --format sarif \
              --output "/reports/$service.sarif" "$img"
          done
      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: reports/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  # PHASE 5 — PUSH TO REGISTRY
  # ═══════════════════════════════════════════════════════════

  docker-push:
    name: Push Images to DockerHub
    runs-on: ubuntu-latest
    needs: [trivy-image]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-2'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull and retag images from GHCR
        run: |
          REPO=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for service in frontend user-service cv-service user-content-service \
                         api-gateway notification-service application-service \
                         job-offer-service workflow-service contact-agent \
                         job-extractor cv-optimizer job-crawler search-agent \
                         template-agent; do
            ghcr_image="ghcr.io/${REPO}/cv-${service}:${{ github.sha }}"
            docker pull "$ghcr_image"
            docker tag "$ghcr_image" "cv-${service}"
          done
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for repo in $(docker images "cv-*" --format "{{.Repository}}" | sort -u); do
            service="${repo#cv-}"
            hub_image="$DOCKERHUB_USERNAME/$service"
            docker tag "$repo" "$hub_image:latest"
            docker tag "$repo" "$hub_image:${{ github.sha }}"
            docker push "$hub_image:latest"
            docker push "$hub_image:${{ github.sha }}"
          done

  # ═══════════════════════════════════════════════════════════
  # PHASE 6 — DEPLOY
  # ═══════════════════════════════════════════════════════════

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-2'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy stack
        run: |
          echo "Deploying commit ${{ github.sha }}"
          echo "Target: production / staging"
          echo "Run: docker compose pull && docker compose up -d --remove-orphans on target host"
