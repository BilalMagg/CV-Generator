# ─────────────────────────────────────────────────────────────
# CV Generator – CI/CD Pipeline
# Triggered on every push & PR to main/develop/"feature/ci"
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, develop, feature/ci]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read
  security-events: write
  packages: write

jobs:

  # ═══════════════════════════════════════════════════════════
  # PHASE 1 — STATIC CHECKS  (parallel)
  # ═══════════════════════════════════════════════════════════

  sonarcloud:
    name: Code Quality - SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Dockerized SonarScanners via Makefile
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
        run: make sonar-scan-all

  trivy-fs:
    name: Security - Trivy (FS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  compose-validate:
    name: Validate Compose Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder .env files for CI
        run: |
          for dir in ai_agents/services/*/; do
            touch "$dir.env"
          done
      - name: Validate Docker Compose files
        run: |
          docker compose config --quiet
          docker compose -f backend/docker-compose.yml config --quiet
          docker compose -f api_gateway/docker-compose.yml config --quiet
          docker compose -f ai_agents/docker-compose.yml config --quiet

  # ═══════════════════════════════════════════════════════════
  # PHASE 2 — COMPONENT TESTS  (parallel, after phase 1 gates)
  # ═══════════════════════════════════════════════════════════

  backend-tests:
    name: Tests - Backend (.NET)
    runs-on: ubuntu-latest
    needs: [trivy-fs, compose-validate]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Restore
        run: dotnet restore CV_Generator.sln
      - name: Build
        run: dotnet build CV_Generator.sln --no-restore -c Release
      - name: Test
        run: >
          dotnet test CV_Generator.sln --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory coverage/
          --settings tests/coverlet.runsettings
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/**/coverage.opencover.xml
          retention-days: 7

  frontend-tests:
    name: Tests - Frontend (Angular)
    runs-on: ubuntu-latest
    needs: [trivy-fs, compose-validate]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx ng lint || echo "No linter configured"
      - name: Unit Tests
        run: npx ng test --no-watch
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  ai-agents-tests:
    name: Tests - AI Agents (Python)
    runs-on: ubuntu-latest
    needs: [trivy-fs, compose-validate]
    defaults:
      run:
        working-directory: ai_agents
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('ai_agents/**/requirements.txt', 'ai_agents/**/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install service dependencies
        run: |
          for dir in services/*/; do
            if [ -f "$dir/requirements.txt" ]; then
              pip install -r "$dir/requirements.txt" --quiet
            fi
          done
          pip install -e services/common-tools[dev] --quiet
      - name: Run Python tests
        run: |
          cd services/common-tools && python -m pytest test_pdf_tools.py -v --tb=short || true
          cd ../contact-agent && python run_test.py || true

  # ═══════════════════════════════════════════════════════════
  # PHASE 3 — BUILD ONCE  (after all tests pass)
  # ═══════════════════════════════════════════════════════════

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, ai-agents-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create placeholder .env files
        run: |
          for dir in ai_agents/services/*/; do
            touch "$dir.env"
          done
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build all images
        env:
          DOCKER_BUILDKIT: 1
        run: docker compose build
      - name: Push images to GHCR
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository_owner }}
        run: |
          for image in $(docker images "cv-*" --format "{{.Repository}}" | sort -u); do
            service="${image#cv-}"
            ghcr_image="ghcr.io/${REPO}/cv-${service}:${SHA}"
            docker tag "$image" "$ghcr_image"
            docker push "$ghcr_image"
            echo "Pushed $ghcr_image"
          done

  # ═══════════════════════════════════════════════════════════
  # PHASE 4 — QUALITY GATES  (parallel, after build)
  # ═══════════════════════════════════════════════════════════

  zap-scan:
    name: Security - ZAP Scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder .env files
        run: |
          for dir in ai_agents/services/*/; do
            touch "$dir.env"
          done
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull images from GHCR
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository_owner }}
        run: |
          services=$(docker compose config --services)
          for service in $services; do
            image="cv-${service}"
            ghcr_image="ghcr.io/${REPO}/${image}:${SHA}"
            if docker pull "$ghcr_image" 2>/dev/null; then
              docker tag "$ghcr_image" "$image"
              echo "Pulled $ghcr_image -> $image"
            else
              echo "Skipping $ghcr_image (infra image)"
            fi
          done
      - name: Start all services
        run: |
          docker compose up -d --wait 2>&1 || true
          # dump logs of any exited containers
          for container in $(docker compose ps --all --filter status=exited --format "{{.Names}}" 2>/dev/null); do
            echo "=== FAILED: $container ==="
            docker compose logs "$container" 2>/dev/null || docker logs "$container" 2>/dev/null || true
          done
          # fail if any container exited
          if [ -n "$(docker compose ps --all --filter status=exited -q 2>/dev/null)" ]; then
            echo "ERROR: One or more containers exited"
            exit 1
          fi
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            sleep 5
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8080/health 2>/dev/null || echo "000")
            [ "$STATUS" = "200" ] && echo "API Gateway healthy" && break
            echo "Attempt $i - API Gateway: $STATUS"
          done
          echo "All services up: $(docker compose ps --services --filter status=running | wc -l)"
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080"
          cmd_options: "-a -j"
          allow_issue_writing: false
      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_json.json
          retention-days: 7
      - name: Store service logs on failure
        if: failure()
        run: |
          for container in $(docker compose ps --all --format "{{.Names}}" 2>/dev/null); do
            echo "========== $container =========="
            docker compose logs "$container" --tail=100 2>/dev/null || true
          done > service-logs.txt
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: service-logs.txt
      - name: Stop services
        if: always()
        run: docker compose down -v

  trivy-image:
    name: Security - Trivy (Images)
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull and retag images from GHCR
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository_owner }}
        run: |
          for service in frontend user-service cv-service user-content-service \
                         api-gateway notification-service application-service \
                         job-offer-service workflow-service contact-agent \
                         cv-optimizer job-crawler search-agent template-agent; do
            ghcr_image="ghcr.io/${REPO}/cv-${service}:${SHA}"
            docker pull "$ghcr_image"
            docker tag "$ghcr_image" "cv-${service}"
          done
      - name: Scan built images
        run: |
          mkdir -p reports
          for img in $(docker images "cv-*" --format "{{.Repository}}"); do
            service="${img#cv-}"
            echo "Scanning: $img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${{ github.workspace }}/reports:/reports" \
              aquasec/trivy:latest image --severity HIGH,CRITICAL \
              --exit-code 0 --format sarif \
              --output "/reports/$service.sarif" "$img"
          done
      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: reports/
          retention-days: 7

  e2e-tests:
    name: E2E Tests - Cypress
    runs-on: ubuntu-latest
    needs: [docker-build]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder .env files
        run: |
          for dir in "${{ github.workspace }}/ai_agents/services/"*/; do
            touch "$dir.env"
          done
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull images from GHCR
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository_owner }}
        run: |
          services=$(docker compose config --services)
          for service in $services; do
            image="cv-${service}"
            ghcr_image="ghcr.io/${REPO}/${image}:${SHA}"
            if docker pull "$ghcr_image" 2>/dev/null; then
              docker tag "$ghcr_image" "$image"
              echo "Pulled $ghcr_image -> $image"
            else
              echo "Skipping $ghcr_image (infra image)"
            fi
          done
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start services
        run: |
          docker compose up -d --wait 2>&1 || true
          # dump logs of any exited containers
          for container in $(docker compose ps --all --filter status=exited --format "{{.Names}}" 2>/dev/null); do
            echo "=== FAILED: $container ==="
            docker compose logs "$container" 2>/dev/null || docker logs "$container" 2>/dev/null || true
          done
          # fail if any container exited
          if [ -n "$(docker compose ps --all --filter status=exited -q 2>/dev/null)" ]; then
            echo "ERROR: One or more containers exited"
            exit 1
          fi
          for i in $(seq 1 20); do
            sleep 3
            GW=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health 2>/dev/null || echo "000")
            FE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 2>/dev/null || echo "000")
            echo "Gateway: $GW  Frontend: $FE"
            [ "$GW" = "200" ] && [ "$FE" = "200" ] && break
          done
      - name: Cypress E2E
        run: npx cypress run --e2e --browser electron --headless
      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend/cypress/screenshots/
            frontend/cypress/videos/
          retention-days: 7
      - name: Store service logs on failure
        if: failure()
        run: |
          for container in $(docker compose ps --all --format "{{.Names}}" 2>/dev/null); do
            echo "========== $container =========="
            docker compose logs "$container" --tail=100 2>/dev/null || true
          done > service-logs.txt
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: service-logs.txt
      - name: Stop services
        if: always()
        run: docker compose down -v

  # ═══════════════════════════════════════════════════════════
  # PHASE 5 — PUSH TO REGISTRY  (after all quality gates pass)
  # ═══════════════════════════════════════════════════════════

  docker-push:
    name: Push Images to DockerHub
    runs-on: ubuntu-latest
    needs: [zap-scan, e2e-tests, trivy-image]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull and retag images from GHCR
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository_owner }}
        run: |
          for service in frontend user-service cv-service user-content-service \
                         api-gateway notification-service application-service \
                         job-offer-service workflow-service contact-agent \
                         cv-optimizer job-crawler search-agent template-agent; do
            ghcr_image="ghcr.io/${REPO}/cv-${service}:${SHA}"
            docker pull "$ghcr_image"
            docker tag "$ghcr_image" "cv-${service}"
          done
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and push images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for repo in $(docker images "cv-*" --format "{{.Repository}}" | sort -u); do
            service="${repo#cv-}"
            hub_image="$DOCKERHUB_USERNAME/$service"
            docker tag "$repo" "$hub_image:latest"
            docker tag "$repo" "$hub_image:${{ github.sha }}"
            docker push "$hub_image:latest"
            docker push "$hub_image:${{ github.sha }}"
          done

  # ═══════════════════════════════════════════════════════════
  # PHASE 6 — DEPLOY  (after push)
  # ═══════════════════════════════════════════════════════════

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy stack
        run: |
          echo "Deploying commit ${{ github.sha }}"
          echo "Target: production / staging"
          echo "Run: docker compose pull && docker compose up -d --remove-orphans on target host"
