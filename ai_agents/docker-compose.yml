# AI Agents compose
# Can be used standalone: cd ai_agents && docker compose up
# Or included from root: include in root docker-compose.yml

services:
  job-extractor:
    build:
      context: .
      dockerfile: services/job-extractor/Dockerfile
    container_name: cv-job-extractor
    ports:
      - "${JOB_EXTRACTOR_PORT:-8001}:${JOB_EXTRACTOR_PORT:-8001}"
    env_file:
      - ./services/job-extractor/.env
    environment:
      - JOB_EXTRACTOR_URL=http://${JOB_EXTRACTOR_HOST:-cv-job-extractor}:${JOB_EXTRACTOR_PORT:-8001}
      - BACKEND_BASE_URL=http://${GATEWAY_HOST:-cv-api-gateway}:${GATEWAY_PORT:-8080}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${JOB_EXTRACTOR_PORT:-8001}/api/v1/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cv-network

  search-agent:
    build:
      context: .
      dockerfile: services/search-agent/Dockerfile
    container_name: cv-search-agent
    ports:
      - "${SEARCH_AGENT_PORT:-8002}:${SEARCH_AGENT_PORT:-8002}"
    env_file:
      - ./services/search-agent/.env
    environment:
      - SEARCH_AGENT_URL=http://${SEARCH_AGENT_HOST:-cv-search-agent}:${SEARCH_AGENT_PORT:-8002}
      - BACKEND_BASE_URL=http://${GATEWAY_HOST:-cv-api-gateway}:${GATEWAY_PORT:-8080}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${SEARCH_AGENT_PORT:-8002}/api/v1/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cv-network

  template-agent:
    build:
      context: .
      dockerfile: services/template-agent/Dockerfile
    container_name: cv-template-agent
    ports:
      - "${TEMPLATE_AGENT_PORT:-8003}:${TEMPLATE_AGENT_PORT:-8003}"
    env_file:
      - ./services/template-agent/.env
    environment:
      - TEMPLATE_AGENT_URL=http://${TEMPLATE_AGENT_HOST:-cv-template-agent}:${TEMPLATE_AGENT_PORT:-8003}
      - BACKEND_BASE_URL=http://${GATEWAY_HOST:-cv-api-gateway}:${GATEWAY_PORT:-8080}
      - MINIO_ENDPOINT=minio:9000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${TEMPLATE_AGENT_PORT:-8003}/api/v1/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cv-network

  cv-optimizer:
    build:
      context: .
      dockerfile: services/cv-optimizer/Dockerfile
    container_name: cv-cv-optimizer
    ports:
      - "${CV_OPTIMIZER_PORT:-8004}:${CV_OPTIMIZER_PORT:-8004}"
    env_file:
      - ./services/cv-optimizer/.env
    environment:
      - CV_OPTIMIZER_URL=http://${CV_OPTIMIZER_HOST:-cv-optimizer}:${CV_OPTIMIZER_PORT:-8004}
      - BACKEND_BASE_URL=http://${GATEWAY_HOST:-cv-api-gateway}:${GATEWAY_PORT:-8080}
      - DATABASE_URL=host=${CV_DB_HOST:-cv-cv-db} port=${CV_DB_PORT:-5432} dbname=cv_db user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${CV_OPTIMIZER_PORT:-8004}/api/v1/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cv-network

  contact-agent:
    build:
      context: .
      dockerfile: services/contact-agent/Dockerfile
    container_name: cv-contact-agent
    ports:
      - "${CONTACT_AGENT_PORT:-8005}:${CONTACT_AGENT_PORT:-8005}"
    env_file:
      - ./services/contact-agent/.env
    environment:
      - CONTACT_AGENT_URL=http://${CONTACT_AGENT_HOST:-cv-contact-agent}:${CONTACT_AGENT_PORT:-8005}
      - SMTP_SERVER=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${CONTACT_AGENT_PORT:-8005}/api/v1/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cv-network

  job-crawler:
    build:
      context: .
      dockerfile: services/job-crawler/Dockerfile
    container_name: cv-job-crawler
    ports:
      - "${JOB_CRAWLER_PORT:-8006}:${JOB_CRAWLER_PORT:-8006}"
    env_file:
      - ./services/job-crawler/.env
    environment:
      - JOB_CRAWLER_URL=http://${JOB_CRAWLER_HOST:-cv-job-crawler}:${JOB_CRAWLER_PORT:-8006}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_HOST:-kafka}:${KAFKA_PORT:-9092}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${JOB_CRAWLER_PORT:-8006}/api/v1/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cv-network

networks:
  cv-network:
    name: ${CV_NETWORK:-cv-network}
