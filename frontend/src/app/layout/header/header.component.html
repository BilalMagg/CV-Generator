<header class="app-header">

  <!-- Breadcrumb -->
  <div class="breadcrumb">
    <span class="breadcrumb-root">{{ appName }}</span>
    <svg viewBox="0 0 24 24" fill="none" width="11" height="11" class="breadcrumb-sep">
      <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="breadcrumb-page">{{ pageName }}</span>
  </div>

  <div class="spacer"></div>

  <!-- Help -->
  <button class="header-btn">
    <svg viewBox="0 0 24 24" fill="none" width="13" height="13">
      <path d="M6 9a3 3 0 1 1 3-3v12a3 3 0 1 1-3-3h12a3 3 0 1 1-3 3V6a3 3 0 1 1 3 3z"
        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Help</span>
  </button>

  @if (isLoggedIn()) {
    <!-- Export / Import -->
    <button class="header-btn" (click)="exportOpen.set(true)" title="Export data">
      <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
        <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Export</span>
    </button>

    <div class="import-wrap">
      <button class="header-btn" (click)="importMenuOpen.set(!importMenuOpen())" title="Import data">
        <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
          <path d="M12 21V9m0 0 4 4m-4-4-4 4M5 3h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Import</span>
      </button>
      @if (importMenuOpen()) {
        <div class="import-menu">
          <button (click)="openImport('companies')">Companies</button>
          <button (click)="openImport('contacts')">Contacts</button>
          <button (click)="openImport('applications')">Applications</button>
        </div>
      }
    </div>
  }

  <!-- Notification bell -->
  <button class="header-btn notif-btn">
    <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"
        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="notif-dot"></span>
  </button>

  <div class="v-sep"></div>

  <!-- Signed-in status -->
  <div class="status-row">
    <span class="status-dot"></span>
    <span class="status-text">{{ userFullName() }}</span>
  </div>

</header>

@if (exportOpen()) {
  <app-export-dialog [open]="exportOpen()" (close)="exportOpen.set(false)" />
}

@if (importType(); as t) {
  <app-sheet-import-dialog [type]="t" [open]="importType() !== null" (openChange)="!$event && importType.set(null)" />
}
