<section class="arc-cta">
  <div class="arc-cta-inner">

    <!-- Badge -->
    <div class="arc-badge">✦ Driftly</div>

    <!-- Heading -->
    <h2 class="arc-heading">
      Ready to land your<br>next role faster?
    </h2>

    <!-- CTA -->
    <a routerLink="/register" class="arc-btn">
      Get started <span class="arc-arrow">→</span>
    </a>

    <!-- Avatar arc -->
    <div class="arc-row">
      @for (avatar of avatars; track avatar.initials) {
        <div
          class="arc-avatar"
          [class.arc-avatar--center]="avatar.zIndex === avatars.length"
          [style.transform]="'translateY(' + avatar.arcY + 'px) scale(' + avatar.scale + ')'"
          [style.z-index]="avatar.zIndex"
        >
          <div class="arc-avatar-inner" [style.background]="gradientFor(avatar.hue)">
            {{ avatar.initials }}
          </div>
        </div>
      }
    </div>

  </div>
</section>
