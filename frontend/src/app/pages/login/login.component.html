<section class="container" [class.sign-up-mode]="mode() === 'sign-up'">
  <div class="forms-container">
    <div class="signin-signup">

      <!-- Sign In -->
      <form class="sign-in-form" (ngSubmit)="onSignIn()" #signInForm="ngForm">
        <h2>Sign in</h2>

        @if (signInError) {
          <div class="alert error">{{ signInError }}</div>
        }

        <div class="input-field">
          <i class="ti ti-mail"></i>
          <input
            type="email"
            name="signInEmail"
            [(ngModel)]="signInEmail"
            #signInEmailRef="ngModel"
            required
            email
            placeholder="Email"
            [class.input-error]="signInEmailRef.invalid && signInEmailRef.dirty"
          />
        </div>

        <div class="input-field">
          <i class="ti ti-lock"></i>
          <input
            type="password"
            name="signInPassword"
            [(ngModel)]="signInPassword"
            #signInPasswordRef="ngModel"
            required
            placeholder="Password"
            [class.input-error]="signInPasswordRef.invalid && signInPasswordRef.dirty"
          />
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="signInLoading">
          @if (signInLoading) {
            <span class="spinner"></span> Signing in...
          } @else {
            Login
          }
        </button>

        <div class="social-text">Or sign in with</div>
        <div class="social-media">
          <button type="button" class="social-icon" (click)="signInWithProvider('google')" title="Sign in with Google">
            <i class="ti ti-brand-google"></i>
          </button>
          <button type="button" class="social-icon" (click)="signInWithProvider('github')" title="Sign in with GitHub">
            <i class="ti ti-brand-github"></i>
          </button>
        </div>

        <p class="sso-text">
          <button type="button" class="btn-link" (click)="signInWithSso()">Sign in with SSO &rarr;</button>
        </p>
      </form>

      <!-- Sign Up -->
      <form class="sign-up-form" (ngSubmit)="onSignUp()" #signUpForm="ngForm">
        <h2>Sign Up</h2>

        @if (signUpError) {
          <div class="alert error">{{ signUpError }}</div>
        }
        @if (signUpSuccess) {
          <div class="alert success">{{ signUpSuccess }}</div>
        }

        <div class="input-field">
          <i class="ti ti-user"></i>
          <input
            type="text"
            name="signUpFirstName"
            [(ngModel)]="signUpFirstName"
            #fnRef="ngModel"
            required
            placeholder="First Name"
          />
        </div>

        <div class="input-field">
          <i class="ti ti-user"></i>
          <input
            type="text"
            name="signUpLastName"
            [(ngModel)]="signUpLastName"
            #lnRef="ngModel"
            required
            placeholder="Last Name"
          />
        </div>

        <div class="input-field">
          <i class="ti ti-mail"></i>
          <input
            type="email"
            name="signUpEmail"
            [(ngModel)]="signUpEmail"
            #signUpEmailRef="ngModel"
            required
            email
            placeholder="Email"
          />
        </div>

        <div class="input-field">
          <i class="ti ti-lock"></i>
          <input
            type="password"
            name="signUpPassword"
            [(ngModel)]="signUpPassword"
            #signUpPassRef="ngModel"
            required
            minlength="8"
            placeholder="Password (min 8 characters)"
          />
        </div>

        <div class="input-field">
          <i class="ti ti-lock"></i>
          <input
            type="password"
            name="signUpConfirm"
            [(ngModel)]="signUpConfirm"
            #confirmRef="ngModel"
            required
            placeholder="Confirm Password"
          />
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="signUpLoading">
          @if (signUpLoading) {
            <span class="spinner"></span> Creating account...
          } @else {
            Sign Up
          }
        </button>

        <div class="social-text">Or sign up with</div>
        <div class="social-media">
          <button type="button" class="social-icon" (click)="signInWithProvider('google')" title="Sign up with Google">
            <i class="ti ti-brand-google"></i>
          </button>
          <button type="button" class="social-icon" (click)="signInWithProvider('github')" title="Sign up with GitHub">
            <i class="ti ti-brand-github"></i>
          </button>
        </div>
      </form>

    </div>
  </div>

  <div class="panels-container">
    <div class="panel left-panel">
      <div class="content">
        <h3>New here?</h3>
        <p>Create your account and get started.</p>
        <button type="button" class="btn transparent" (click)="toggleMode()">Sign Up</button>
      </div>
      <img src="auth/image1.svg" class="image" alt="" />
    </div>

    <div class="panel right-panel">
      <div class="content">
        <h3>One of us?</h3>
        <p>Sign in to your account.</p>
        <button type="button" class="btn transparent" (click)="toggleMode()">Sign In</button>
      </div>
      <img src="auth/image2.svg" class="image" alt="" />
    </div>
  </div>
</section>
