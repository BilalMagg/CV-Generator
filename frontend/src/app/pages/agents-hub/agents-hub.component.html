<div class="agents-page">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-left">
      <span class="header-eyebrow">AI Workspace</span>
      <h1 class="header-title">Agents Hub</h1>
      <p class="header-sub">Manage and launch your AI agents</p>
    </div>
    <div class="header-right">
      <a [routerLink]="'/agents-hub/guide/search-agent'" class="header-link">
        <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 8v4M12 16v-0.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Guides
      </a>
    </div>
  </div>

  <!-- Main Content: Grid + Aside -->
  <div class="main-content">
    <div class="grid-wrap">
      <div class="magazine-grid">
        <app-agent-card
          *ngFor="let item of cards"
          class="card-cell"
          [ngClass]="item.size"
          [agent]="item.agent"
          [size]="item.size"
        />
      </div>
    </div>

    <!-- Aside Panel -->
    <aside class="aside-panel">
      <!-- Overview card -->
      <div class="aside-section">
        <h3 class="aside-title">Agent Overview</h3>
        <div class="stat-row">
          <div class="stat-item">
            <span class="stat-value">{{ totalAgents }}</span>
            <span class="stat-label">Total</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-active">{{ activeAgents }}</span>
            <span class="stat-label">Active</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-idle">{{ idleAgents }}</span>
            <span class="stat-label">Idle</span>
          </div>
          <div class="stat-item">
            <span class="stat-value stat-inactive">{{ inactiveAgents }}</span>
            <span class="stat-label">Offline</span>
          </div>
        </div>
      </div>

      <!-- Agent Status -->
      <div class="aside-section">
        <h3 class="aside-title">Agent Status</h3>
        <div class="status-list">
          <div class="status-item" *ngFor="let agent of allAgents">
            <span class="status-indicator" [class.is-active]="agent.status === 'active'" [class.is-idle]="agent.status === 'idle'"></span>
            <span class="status-name">{{ agent.name }}</span>
            <span class="status-badge-text">{{ agent.status }}</span>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="aside-section">
        <h3 class="aside-title">Quick Actions</h3>
        <div class="action-list">
          <a [routerLink]="'/agents-hub/guide/search-agent'" class="action-item">
            <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
              <path d="M12 8v4M12 16v-0.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            View Agent Guides
          </a>
          <a [routerLink]="'/agents-hub'" class="action-item">
            <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
              <path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            Configure Agents
          </a>
        </div>
      </div>
    </aside>
  </div>
</div>
