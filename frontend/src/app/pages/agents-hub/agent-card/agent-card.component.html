<div class="agent-card" [style.background]="agent.background">
  <img [src]="agent.image" [alt]="agent.name" class="card-bg-img" />
  <div class="card-gradient"></div>

  <div class="card-top">
    <button class="guide-btn" [routerLink]="['/agents-hub/guide', agent.id]" title="Guide">
      <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 8v4M12 16v-0.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <span class="status-dot" [class.is-active]="agent.status === 'active'" [class.is-idle]="agent.status === 'idle'" [class.is-inactive]="agent.status === 'inactive'"></span>
  </div>

  <div class="card-body">
    <h3 class="agent-name">{{ agent.name }}</h3>
    <p class="agent-role">{{ agent.role }}</p>
  </div>

  <div class="card-footer">
    <button class="agent-btn">Open</button>
  </div>
</div>
