name: somia-vm2

networks:
  cv-network:
    name: cv-network

services:
  # ── Search Agent ─────────────────────────────────────────────────────────
  search-agent:
    image: bilalmagg/search-agent:latest
    container_name: cv-search-agent
    ports:
      - "8002:8002"
    env_file:
      - ./search-agent.env
    environment:
      - SEARCH_AGENT_URL=http://cv-search-agent:8002
      - BACKEND_BASE_URL=http://${BILAL_VM1_IP:-cv-api-gateway}:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cv-network

  # ── CV Optimizer ─────────────────────────────────────────────────────────
  cv-optimizer:
    image: bilalmagg/cv-optimizer:latest
    container_name: cv-cv-optimizer
    ports:
      - "8004:8004"
    env_file:
      - ./cv-optimizer.env
    environment:
      - CV_OPTIMIZER_URL=http://cv-optimizer:8004
      - BACKEND_BASE_URL=http://${BILAL_VM1_IP:-cv-api-gateway}:8080
      - DATABASE_URL=host=${MOUHSSINE_IP:-cv-cv-db} port=5432 dbname=cv_db user=postgres password=postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cv-network

  # ── Job Crawler ──────────────────────────────────────────────────────────
  job-crawler:
    image: bilalmagg/job-crawler:latest
    container_name: cv-job-crawler
    ports:
      - "8006:8006"
    env_file:
      - ./job-crawler.env
    environment:
      - JOB_CRAWLER_URL=http://cv-job-crawler:8006
      - KAFKA_BOOTSTRAP_SERVERS=${NOURELHOULDA_IP:-cv-kafka}:9092
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cv-network

  # ── Monitoring ───────────────────────────────────────────────────────────
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - /:/rootfs:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "7010:8080"
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
