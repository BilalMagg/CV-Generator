name: somia-vm1

networks:
  cv-network:
    name: cv-network

services:
  # ── Workflow DB ──────────────────────────────────────────────────────────
  workflow-db:
    image: pgvector/pgvector:pg16
    container_name: cv-workflow-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workflow_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - workflow_db_data:/var/lib/postgresql/data
    networks:
      - cv-network

  # ── Workflow Service ─────────────────────────────────────────────────────
  workflow-service:
    image: bilalmagg/workflow-service:latest
    container_name: cv-workflow-service
    ports:
      - "8084:8084"
      - "18084:18084"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PORT=8084
      - GRPC_PORT=18084
      - ConnectionStrings__DefaultConnection=Host=workflow-db;Port=5432;Database=workflow_db;Username=postgres;Password=postgres
      - JOB_EXTRACTOR_URL=http://${BILAL_VM3_IP:-cv-job-extractor}:8001/api/v1/
      - SEARCH_AGENT_URL=http://${SOMIA_VM2_IP:-cv-search-agent}:8002/api/v1/
      - TEMPLATE_AGENT_URL=http://${BILAL_VM3_IP:-cv-template-agent}:8003/api/v1/
      - CV_OPTIMIZER_URL=http://${SOMIA_VM2_IP:-cv-optimizer}:8004/api/v1/
      - CONTACT_AGENT_URL=http://${BILAL_VM3_IP:-cv-contact-agent}:8005/api/v1/
      - JOB_CRAWLER_URL=http://${SOMIA_VM2_IP:-cv-job-crawler}:8006/api/v1/
      - JOB_OFFER_SERVICE_URL=http://${MOUHSSINE_IP:-cv-job-offer-service}:8086
      - Kafka__BootstrapServers=${NOURELHOULDA_IP:-cv-kafka}:9092
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    depends_on:
      workflow-db:
        condition: service_healthy
    networks:
      - cv-network

  # ── Monitoring ───────────────────────────────────────────────────────────
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - /:/rootfs:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "7010:8080"
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  workflow_db_data:
