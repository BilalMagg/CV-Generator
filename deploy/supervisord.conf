; Propel single-image supervisor: runs backend, gateway, agents and nginx.
; Data services (Postgres / Keycloak / MinIO) are separate compose services.
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:backend]
command=/usr/bin/dotnet /app/backend/CV_Generator.dll
directory=/app/backend
environment=PORT="5000",DOTNET_PrintWorkerOutput="0",DOTNET_gcServer="1"
autorestart=true
startretries=10
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend.err.log

[program:gateway]
command=/usr/bin/dotnet /app/gateway/ApiGateway.dll
directory=/app/gateway
environment=DOTNET_PrintWorkerOutput="0",DOTNET_gcServer="1"
autorestart=true
startretries=10
stdout_logfile=/var/log/supervisor/gateway.log
stderr_logfile=/var/log/supervisor/gateway.err.log

[program:agents]
command=/opt/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app/agents
autorestart=true
startretries=10
stdout_logfile=/var/log/supervisor/agents.log
stderr_logfile=/var/log/supervisor/agents.err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startretries=5
priority=20
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log
