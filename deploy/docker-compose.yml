# =============================================================================
# Propel — Unified Deployment
# =============================================================================
# Usage (from the repo root or wherever this compose file lives):
#   1) copy deploy/.env.example to .env (next to this file) and configure:
#      - COMPOSE_PROFILES=minio   (default: local PostgreSQL + MinIO + Native Auth)
#      - COMPOSE_PROFILES=minimal (leanest: local PostgreSQL + Cloudflare R2 + Native Auth)
#      - COMPOSE_PROFILES=full    (full stack: local PostgreSQL + MinIO + Keycloak)
#   2) docker compose -f deploy/docker-compose.yml up -d --build
#   3) open http://localhost:4200 — register with native auth or log in
#
# Exposed ports:
#   4200 → frontend (nginx proxies /api to the gateway)
#   8080 → gateway (used for OAuth callback and direct API debugging)
#   9001 → MinIO console (when minio profile is active)
#   9090 → Keycloak (when keycloak/full profile is active)
#
# Profiles available:
#   (none)   → postgres + app (minimal cloud stack, e.g. with Cloudflare R2 + Native Auth)
#   minio    → postgres + minio + app (local storage + native auth)
#   keycloak → postgres + keycloak-db + keycloak + app (Keycloak auth)
#   full     → postgres + minio + keycloak-db + keycloak + app (all self-hosted)
# =============================================================================

name: propel

networks:
  propel:
    name: propel-network

volumes:
  postgres_data:
  minio_data:
  keycloak_db_data:
  keycloak_data:

services:
  # ── application DB ─────────────────────────────────────────────────────────
  postgres:
    # pgvector build: provisions the pgvector extension ("vector")
    image: pgvector/pgvector:pg17
    container_name: propel-postgres
    environment:
      POSTGRES_DB: cv_monolith
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bime
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cv_monolith"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [propel]

  # ── object storage (optional if using Cloudflare R2) ────────────────────────
  minio:
    profiles: ["minio", "full"]
    image: cgr.dev/chainguard/minio:latest
    container_name: propel-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"           # console only — data flows stay in-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    networks: [propel]

  # ── Keycloak (+ its own DB) (optional if using Native Auth) ────────────────
  keycloak-db:
    profiles: ["keycloak", "full"]
    image: postgres:17-alpine
    container_name: propel-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secret
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [propel]

  keycloak:
    profiles: ["keycloak", "full"]
    image: quay.io/keycloak/keycloak:26.2
    container_name: propel-keycloak
    ports:
      - "9090:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secret
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME_STRICT: false
      JAVA_OPTS_APPEND: -Xms256m -Xmx768m
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak-realm:/opt/keycloak/data/import
      - keycloak_data:/opt/keycloak/data
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/9000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [propel]

  # ── the application image (backend + gateway + agents + frontend) ─────────
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${APP_IMAGE:-propel:latest}
    container_name: propel-app
    ports:
      - "4200:4200"           # frontend (nginx)
      - "8080:8080"           # gateway (OAuth callback + direct API access)
    environment:
      # Provider selections
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-MinIO}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-Native}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-Gmail}

      # Database connection
      CONNECTION_STRING: Host=postgres;Port=5432;Database=cv_monolith;Username=postgres;Password=bime
      DATABASE_URL: postgresql://postgres:bime@postgres:5432/cv_monolith

      # MinIO storage (active when STORAGE_PROVIDER=MinIO)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

      # Cloudflare R2 storage (active when STORAGE_PROVIDER=CloudflareR2)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-propel}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}

      # Keycloak settings (active when AUTH_PROVIDER=Keycloak or Hybrid)
      JWT_AUTHORITY: ${JWT_AUTHORITY:-http://keycloak:8080/realms/cv-realm}
      KEYCLOAK_HOST: ${KEYCLOAK_HOST:-keycloak}
      KEYCLOAK_PORT: ${KEYCLOAK_PORT:-8080}
      KEYCLOAK_EXTERNAL_HOST: ${KEYCLOAK_EXTERNAL_HOST:-localhost}
      KEYCLOAK_EXTERNAL_PORT: ${KEYCLOAK_EXTERNAL_PORT:-9090}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      # In-container services
      AGENTS_URL: http://localhost:8000
      BACKEND_BASE_URL: http://localhost:5000

      # Gmail integration (per-user, decoupled from Keycloak)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY:-}
      Gmail__CallbackBaseUrl: ${GMAIL_CALLBACK_BASE_URL:-http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [propel]
