# =============================================================================
# Propel — friends' deployment: one `docker compose up` and everything runs.
# =============================================================================
# Usage (from the repo root or wherever this compose file lives):
#   1) copy deploy/.env.example to .env (next to this file) and fill in values
#   2) docker compose -f deploy/docker-compose.yml up -d --build
#   3) open http://localhost:4200 — first user registers through the sign-up
#      flow (Keycloak realm import leaves registration enabled)
#
# Exposed ports:
#   4200 → frontend (nginx proxies /api to the gateway)
#   8080 → gateway (used for the OAuth callback and direct API debugging)
#   9090 → Keycloak (browser-facing login)
#
# Gmail sends additionally need:
#   - GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (Google Cloud OAuth client,
#     authorized redirect: http://localhost:4200/api/gmail/callback)
#   - GMAIL_TOKEN_ENCRYPTION_KEY — base64 of a 32-byte key, e.g.
#     openssl rand -base64 32
#
# LLM API keys are NOT needed here: friends enter them in the app under
# Settings → AI Model (they are encrypted and pushed to the agent sidecar in
# memory). Env keys remain a valid fallback for power users.
# =============================================================================

name: propel

networks:
  propel:
    name: propel-network

volumes:
  postgres_data:
  minio_data:
  keycloak_db_data:
  keycloak_data:

services:
  # ── application DB ─────────────────────────────────────────────────────────
  postgres:
    # pgvector build: the InitialCreate migration provisions the pgvector
    # extension ("vector"), so a stock postgres image fails migration 1 on a
    # fresh DB ('extension "vector" is not available').
    image: pgvector/pgvector:pg17
    container_name: propel-postgres
    environment:
      POSTGRES_DB: cv_monolith
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bime
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cv_monolith"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [propel]

  # ── object storage ─────────────────────────────────────────────────────────
  # MinIO removed their community images from Docker Hub (Sept 2025) and the
  # repo is archived; Chainguard maintains a fresh MinIO build (latest tag).
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: propel-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"           # console only — data flows stay in-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    networks: [propel]

  # ── Keycloak (+ its own DB) ────────────────────────────────────────────────
  keycloak-db:
    image: postgres:17-alpine
    container_name: propel-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secret
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [propel]

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: propel-keycloak
    ports:
      - "9090:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secret
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME_STRICT: false
      JAVA_OPTS_APPEND: -Xms256m -Xmx768m
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak-realm:/opt/keycloak/data/import
      - keycloak_data:/opt/keycloak/data
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # the Keycloak image ships no curl/wget — probe the health TCP port with bash
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/9000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [propel]

  # ── the application image (backend + gateway + agents + frontend) ─────────
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: propel:latest
    container_name: propel-app
    ports:
      - "4200:4200"           # frontend (nginx)
      - "8080:8080"           # gateway (OAuth callback + direct API access)
    environment:
      # data services (in-network names)
      CONNECTION_STRING: Host=postgres;Port=5432;Database=cv_monolith;Username=postgres;Password=bime
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # auth — internal URL for token validation by backend+gateway,
      # external localhost:9090 for the browser-facing login pages
      JWT_AUTHORITY: http://keycloak:8080/realms/cv-realm
      KEYCLOAK_HOST: keycloak
      KEYCLOAK_PORT: "8080"
      KEYCLOAK_EXTERNAL_HOST: localhost
      KEYCLOAK_EXTERNAL_PORT: "9090"
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # services inside this container
      AGENTS_URL: http://localhost:8000
      BACKEND_BASE_URL: http://localhost:5000
      # sidecar extras
      DATABASE_URL: postgresql://postgres:bime@postgres:5432/cv_monolith
      # gmail (optional but strongly recommended)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY:-}
      Gmail__CallbackBaseUrl: http://localhost:4200
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks: [propel]
