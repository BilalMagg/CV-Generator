# Propel frontend + API proxy.
# The SPA is served here; XHR calls to same-origin /api are proxied to the
# gateway (in-container :8080). OAuth/Gmail callbacks can also use this origin.
server {
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CV attachments / ready-CV uploads go through the API — allow generous bodies
    client_max_body_size 30m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Angular SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpe?g|webp|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything API-shaped goes to the gateway.
    # Buffering stays off so SSE streams (workflow template renders, BIME
    # chat) reach the browser live; LLM endpoints can run minutes-long.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
