# =============================================================================
# Propulsion — dev data services ONLY (no application rebuild needed).
# =============================================================================
# Your normal dev workflow runs the backend (:5000), gateway (:8080) and
# agents (:8000) natively — this file just provides the stateful services:
#
#   docker compose -f deploy/docker-compose.data.yml up -d
#
# Matches the app's current defaults: Postgres on 5432 (postgres/bime,
# db cv_monolith), Keycloak on 9090, MinIO on 9000 (+ console 9001).
# =============================================================================

name: propel-data

volumes:
  postgres_data:
  minio_data:
  keycloak_db_data:
  keycloak_data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: propel-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cv_monolith
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bime
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cv_monolith"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO removed their community images from Docker Hub (Sept 2025) and the
    # repo is archived; Chainguard maintains a fresh MinIO build (latest tag).
    image: cgr.dev/chainguard/minio:latest
    container_name: propel-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"           # API (backend/sidecar talk to localhost:9000 in dev)
      - "9001:9001"           # console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  keycloak-db:
    image: postgres:17-alpine
    container_name: propel-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_secret
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: propel-keycloak
    ports:
      - "9090:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_secret
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME_STRICT: false
      JAVA_OPTS_APPEND: -Xms256m -Xmx768m
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak-realm:/opt/keycloak/data/import
      - keycloak_data:/opt/keycloak/data
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # the Keycloak image ships no curl/wget — probe the health TCP port with bash
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/9000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
