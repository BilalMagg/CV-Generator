name: bilal-vm3

networks:
  cv-network:
    name: cv-network

services:
  job-extractor:
    image: bilalmagg/job-extractor:latest
    container_name: cv-job-extractor
    ports:
      - "8001:8001"
    env_file:
      - ./job-extractor.env
    environment:
      - JOB_EXTRACTOR_URL=http://cv-job-extractor:8001
      - BACKEND_BASE_URL=http://cv-api-gateway:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cv-network

  contact-agent:
    image: bilalmagg/contact-agent:latest
    container_name: cv-contact-agent
    ports:
      - "8005:8005"
    env_file:
      - ./contact-agent.env
    environment:
      - CONTACT_AGENT_URL=http://cv-contact-agent:8005
      - SMTP_SERVER=smtp.gmail.com
      - SMTP_PORT=587
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cv-network

  template-agent:
    image: bilalmagg/template-agent:latest
    container_name: cv-template-agent
    ports:
      - "8003:8003"
    env_file:
      - ./template-agent.env
    environment:
      - TEMPLATE_AGENT_URL=http://cv-template-agent:8003
      - BACKEND_BASE_URL=http://cv-api-gateway:8080
      - MINIO_ENDPOINT=minio:9000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cv-network

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - /:/rootfs:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "7010:8080"
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
