name: bilal-vm2

networks:
  cv-network:
    name: cv-network

services:
  user-db:
    image: pgvector/pgvector:pg16
    container_name: cv-user-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - cv-network

  application-db:
    image: pgvector/pgvector:pg16
    container_name: cv-application-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: application_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d application_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - application_db_data:/var/lib/postgresql/data
    networks:
      - cv-network

  notification-db:
    image: pgvector/pgvector:pg16
    container_name: cv-notification-db
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    networks:
      - cv-network

  user-service:
    image: bilalmagg/user-service:latest
    container_name: cv-user-service
    ports:
      - "8082:8082"
      - "18082:18082"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PORT=8082
      - GRPC_PORT=18082
      - ConnectionStrings__DefaultConnection=Host=user-db;Port=5432;Database=user_db;Username=postgres;Password=postgres
      - JWT_AUTHORITY=http://cv-keycloak:8080/realms/cv-realm
      - KAFKA_BOOTSTRAP_SERVERS=cv-kafka:9092
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - cv-network

  application-service:
    image: bilalmagg/application-service:latest
    container_name: cv-application-service
    ports:
      - "8085:8085"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PORT=8085
      - GRPC_PORT=18085
      - ConnectionStrings__DefaultConnection=Host=application-db;Port=5432;Database=application_db;Username=postgres;Password=postgres
      - KAFKA_BOOTSTRAP_SERVERS=cv-kafka:9092
      - JWT_AUTHORITY=http://cv-keycloak:8080/realms/cv-realm
      - USER_SERVICE_GRPC_URL=http://cv-user-service:18082
    depends_on:
      application-db:
        condition: service_healthy
    networks:
      - cv-network

  notification-service:
    image: bilalmagg/notification-service:latest
    container_name: cv-notification-service
    ports:
      - "8087:8087"
    env_file:
      - ./notification-service.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PORT=8087
      - ConnectionStrings__DefaultConnection=Host=notification-db;Port=5432;Database=notification_db;Username=postgres;Password=postgres
      - Kafka__BootstrapServers=cv-kafka:9092
      - USER_SERVICE_GRPC_URL=http://cv-user-service:18082
      - APPLICATION_SERVICE_GRPC_URL=http://cv-application-service:18085
    depends_on:
      notification-db:
        condition: service_healthy
    networks:
      - cv-network

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - /:/rootfs:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "7010:8080"
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  user_db_data:
  application_db_data:
  notification_db_data:
