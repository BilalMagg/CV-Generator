---
# roles/database — create the 8 logical databases on the single RDS instance
# and enable pgvector where the app uses it (workflow_db, cv_db).
#
# NETWORK NOTE: RDS is in private subnets (publicly_accessible = false), so the
# control node cannot reach it directly from the internet. Run this role from
# inside the VPC, or open an SSM port-forward / bastion tunnel to the RDS
# endpoint first and override rds_endpoint/rds_port to point at the tunnel.
# (Flagged as an open item in the README.)
#
# Requires: community.postgresql collection + psycopg2 on the control node.

- name: Create application + keycloak databases
  community.postgresql.postgresql_db:
    name: "{{ item }}"
    state: present
    login_host: "{{ rds_endpoint }}"
    login_port: "{{ rds_port }}"
    login_user: "{{ db_username }}"
    login_password: "{{ db_password }}"
    maintenance_db: "postgres"
  loop:
    - user_db
    - content_db
    - workflow_db
    - application_db
    - job_offer_db
    - notification_db
    - cv_db
    - keycloak

- name: Enable pgvector extension where required
  community.postgresql.postgresql_ext:
    name: vector
    db: "{{ item }}"
    state: present
    login_host: "{{ rds_endpoint }}"
    login_port: "{{ rds_port }}"
    login_user: "{{ db_username }}"
    login_password: "{{ db_password }}"
  loop:
    - workflow_db
    - cv_db
