---
# roles/secrets_overlay — overwrite the SSM placeholders Terraform created with
# the real values now that RDS + the ALB exist:
#   /cvgen/secrets/*  connection strings (built from RDS endpoint + password)
#                     and the API keys / passwords from secrets.yml
#   /cvgen/ext/*      the external-host overlay = the public ALB DNS
#
# Terraform's `ignore_changes = [value]` means a later `terraform apply` will
# NOT revert what we write here.

- name: Build per-service connection strings
  ansible.builtin.set_fact:
    _conn: >-
      Host={{ rds_endpoint }};Port={{ rds_port }};Database=%DB%;Username={{ db_username }};Password={{ db_password }}

- name: Assemble secret parameter map (name -> value)
  ansible.builtin.set_fact:
    secret_values:
      conn-user-service: "{{ _conn | replace('%DB%', 'user_db') }}"
      conn-user-content-service: "{{ _conn | replace('%DB%', 'content_db') }}"
      conn-workflow-service: "{{ _conn | replace('%DB%', 'workflow_db') }}"
      conn-application-service: "{{ _conn | replace('%DB%', 'application_db') }}"
      conn-job-offer-service: "{{ _conn | replace('%DB%', 'job_offer_db') }}"
      conn-notification-service: "{{ _conn | replace('%DB%', 'notification_db') }}"
      conn-cv-service: "{{ _conn | replace('%DB%', 'cv_db') }}"
      cvoptimizer-database-url: "host={{ rds_endpoint }} port={{ rds_port }} dbname=cv_db user={{ db_username }} password={{ db_password }}"
      postgres-password: "{{ db_password }}"
      groq-api-key: "{{ groq_api_key }}"
      openai-api-key: "{{ openai_api_key | default('') }}"
      mistral-api-key: "{{ mistral_api_key | default('') }}"
      tavily-api-key: "{{ tavily_api_key | default('') }}"
      crawl4ai-api-key: "{{ crawl4ai_api_key | default('') }}"
      keycloak-client-secret: "{{ keycloak_client_secret }}"
      keycloak-admin-password: "{{ keycloak_admin_password }}"
      google-client-id: "{{ google_client_id | default('') }}"
      google-client-secret: "{{ google_client_secret | default('') }}"
      github-client-id: "{{ github_client_id | default('') }}"
      github-client-secret: "{{ github_client_secret | default('') }}"
      gmail-token-encryption-key: "{{ gmail_token_encryption_key }}"
      smtp-username: "{{ smtp_username | default('') }}"
      smtp-password: "{{ smtp_password | default('') }}"
      minio-root-user: "{{ minio_root_user }}"
      minio-root-password: "{{ minio_root_password }}"

- name: Assemble external-host overlay map (name -> value)
  ansible.builtin.set_fact:
    ext_values:
      gateway-host: "{{ alb_dns }}"
      gateway-port: "80"
      frontend-host: "{{ alb_dns }}"
      frontend-port: "80"
      keycloak-external-host: "{{ alb_dns }}"
      keycloak-external-port: "80"
      kc-hostname: "http://{{ alb_dns }}"
      gmail-callback-base-url: "http://{{ alb_dns }}"

- name: Write SecureString secrets to SSM (skips blanks left optional)
  ansible.builtin.command: >
    aws ssm put-parameter
    --region {{ region }}
    --name "/{{ project }}/secrets/{{ item.key }}"
    --type SecureString
    --overwrite
    --value "{{ item.value }}"
  loop: "{{ secret_values | dict2items }}"
  loop_control:
    label: "/{{ project }}/secrets/{{ item.key }}"
  when: item.value | length > 0
  no_log: true
  changed_when: true

- name: Write external-host overlay (String) to SSM
  ansible.builtin.command: >
    aws ssm put-parameter
    --region {{ region }}
    --name "/{{ project }}/ext/{{ item.key }}"
    --type String
    --overwrite
    --value "{{ item.value }}"
  loop: "{{ ext_values | dict2items }}"
  loop_control:
    label: "/{{ project }}/ext/{{ item.key }}"
  changed_when: true
