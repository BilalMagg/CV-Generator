---
# roles/images — build every service image and push it to ECR.
#
# build_map context/dockerfile pairs were verified against the repo (§5.1).
# IMPORTANT: backend (.NET) and AI-agent images do NOT build from their own
# service folder — the .NET Dockerfiles pull in backend/src/common-protos and
# the agent Dockerfiles `COPY services/common-tools`, so the build CONTEXT is
# `backend` / `ai_agents` respectively. keycloak builds the custom realm image.
#
# Paths are relative to repo_root (set in the playbook).

- name: Define build map (service -> {context, dockerfile})
  ansible.builtin.set_fact:
    build_map:
      frontend:             { context: "frontend",                dockerfile: "frontend/Dockerfile" }
      api-gateway:          { context: "api_gateway",             dockerfile: "api_gateway/Dockerfile" }
      user-service:         { context: "backend",                 dockerfile: "backend/src/user-service/Dockerfile" }
      user-content-service: { context: "backend",                 dockerfile: "backend/src/user-content-service/Dockerfile" }
      workflow-service:     { context: "backend",                 dockerfile: "backend/src/workflow-service/Dockerfile" }
      application-service:  { context: "backend",                 dockerfile: "backend/src/application-service/Dockerfile" }
      job-offer-service:    { context: "backend",                 dockerfile: "backend/src/job-offer-service/Dockerfile" }
      notification-service: { context: "backend",                 dockerfile: "backend/src/notification-service/Dockerfile" }
      cv-service:           { context: "backend",                 dockerfile: "backend/src/cv-service/Dockerfile" }
      job-extractor:        { context: "ai_agents",               dockerfile: "ai_agents/services/job-extractor/Dockerfile" }
      search-agent:         { context: "ai_agents",               dockerfile: "ai_agents/services/search-agent/Dockerfile" }
      template-agent:       { context: "ai_agents",               dockerfile: "ai_agents/services/template-agent/Dockerfile" }
      cv-optimizer:         { context: "ai_agents",               dockerfile: "ai_agents/services/cv-optimizer/Dockerfile" }
      contact-agent:        { context: "ai_agents",               dockerfile: "ai_agents/services/contact-agent/Dockerfile" }
      job-crawler:          { context: "ai_agents",               dockerfile: "ai_agents/services/job-crawler/Dockerfile" }
      # custom Keycloak: context is the realm dir so COPY can see the JSON
      keycloak:             { context: "api_gateway/keycloak-realm", dockerfile: "infrastructure/cloud/keycloak/Dockerfile" }

- name: Derive ECR registry host from any repo URL
  ansible.builtin.set_fact:
    ecr_registry: "{{ (ecr_urls.values() | list | first).split('/')[0] }}"

- name: Log in to ECR
  ansible.builtin.shell: >
    aws ecr get-login-password --region {{ region }}
    | docker login --username AWS --password-stdin {{ ecr_registry }}
  changed_when: true

- name: Build and push each image
  ansible.builtin.shell: |
    set -euo pipefail
    docker build \
      -f "{{ repo_root }}/{{ item.value.dockerfile }}" \
      -t "{{ ecr_urls[item.key] }}:{{ image_tag }}" \
      "{{ repo_root }}/{{ item.value.context }}"
    docker push "{{ ecr_urls[item.key] }}:{{ image_tag }}"
  args:
    executable: /bin/bash
  loop: "{{ build_map | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: true
