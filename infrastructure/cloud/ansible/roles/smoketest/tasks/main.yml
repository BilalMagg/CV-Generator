---
# roles/smoketest — verify the public surface answers after a deploy.
#
# Checks three things through the ALB:
#   /              -> frontend (200)
#   /api/agents    -> api-gateway is routed and reachable (auth may make it 401;
#                     any HTTP response proves routing — connection refused fails)
#   /realms/master -> Keycloak is exposed and up (200)
#
# Fails loudly if the frontend or Keycloak are not reachable.

- name: Frontend responds at /
  ansible.builtin.uri:
    url: "http://{{ alb_dns }}/"
    method: GET
    status_code: [200]
    return_content: false
  register: fe
  retries: 10
  delay: 15
  until: fe.status == 200

- name: API gateway is routed (any HTTP status counts; 401/403 = reached + auth)
  ansible.builtin.uri:
    url: "http://{{ alb_dns }}/api/agents"
    method: GET
    status_code: [200, 401, 403, 404, 500]
    return_content: false
  register: gw
  retries: 10
  delay: 15
  until: gw.status is defined

- name: Keycloak is exposed via the ALB at /realms/master
  ansible.builtin.uri:
    url: "http://{{ alb_dns }}/realms/master"
    method: GET
    status_code: [200]
    return_content: false
  register: kc
  retries: 10
  delay: 15
  until: kc.status == 200

- name: Smoke test summary
  ansible.builtin.debug:
    msg:
      - "frontend  GET /              -> {{ fe.status }}"
      - "gateway   GET /api/agents    -> {{ gw.status | default('n/a') }}"
      - "keycloak  GET /realms/master -> {{ kc.status }}"
      - "App URL: http://{{ alb_dns }}"
