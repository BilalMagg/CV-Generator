---
# roles/deploy — force a fresh rollout of every ECS service.
#
# The task definitions reference a fixed image tag (:latest) and SSM parameter
# ARNs, so the way to make services pick up newly pushed images and the
# now-populated secrets/overlay is `update-service --force-new-deployment`.
#
# ecs_services comes from the Terraform output (all 15 app services + kafka,
# keycloak, minio).

- name: Force new deployment for every ECS service
  ansible.builtin.command: >
    aws ecs update-service
    --region {{ region }}
    --cluster {{ cluster_name }}
    --service {{ item }}
    --force-new-deployment
  loop: "{{ ecs_services }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true

- name: Wait for services to reach a steady state
  ansible.builtin.command: >
    aws ecs wait services-stable
    --region {{ region }}
    --cluster {{ cluster_name }}
    --services {{ ecs_services | join(' ') }}
  changed_when: false
  # services-stable polls up to ~10 min; large fleets may need a re-run.
  register: wait_result
  failed_when: false

- name: Report wait result
  ansible.builtin.debug:
    msg: "services-stable returned rc={{ wait_result.rc }} (0 = all stable). Re-run --tags deploy if it timed out."
