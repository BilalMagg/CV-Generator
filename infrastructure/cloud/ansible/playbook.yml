---
# playbook.yml — deploy CV Generator onto the Terraform-built infra.
#
# Order: images -> database -> secrets_overlay -> deploy -> smoketest.
# Run AFTER `terraform apply`. Reads Terraform outputs to learn the ALB DNS,
# RDS endpoint, ECR URLs, and cluster name.
#
# Usage:
#   ansible-playbook playbook.yml --ask-vault-pass
#   ansible-playbook playbook.yml --tags images        # just build+push
#   ansible-playbook playbook.yml --tags deploy        # just roll services
#
# Prereqs: awscli v2 (configured), docker, psql, and the community.postgresql
# collection on the control node.

- name: Deploy CV Generator to AWS (ECS on EC2)
  hosts: local
  connection: local
  gather_facts: true

  vars:
    terraform_dir: "{{ playbook_dir }}/../terraform"
    repo_root: "{{ playbook_dir }}/../../.."

  vars_files:
    - group_vars/secrets.yml

  pre_tasks:
    - name: Read Terraform outputs
      ansible.builtin.command: terraform -chdir={{ terraform_dir }} output -json
      register: tf_out
      changed_when: false
      tags: always

    - name: Parse Terraform outputs into facts
      ansible.builtin.set_fact:
        tf: "{{ tf_out.stdout | from_json }}"
      tags: always

    - name: Derive convenience facts
      ansible.builtin.set_fact:
        region: "{{ tf.region.value }}"
        project: "{{ tf.project.value }}"
        alb_dns: "{{ tf.alb_dns_name.value }}"
        rds_endpoint: "{{ tf.rds_endpoint.value }}"
        rds_port: "{{ tf.rds_port.value }}"
        db_username: "{{ tf.db_username.value }}"
        cluster_name: "{{ tf.ecs_cluster_name.value }}"
        ecr_urls: "{{ tf.ecr_repository_urls.value }}"
        ecs_services: "{{ tf.ecs_service_names.value }}"
        image_tag: "latest"
      tags: always

    - name: Show what we are deploying to
      ansible.builtin.debug:
        msg:
          - "Region:   {{ region }}"
          - "Cluster:  {{ cluster_name }}"
          - "ALB:      http://{{ alb_dns }}"
          - "RDS:      {{ rds_endpoint }}:{{ rds_port }}"
      tags: always

  roles:
    - { role: images, tags: ["images"] }
    - { role: database, tags: ["database"] }
    - { role: secrets_overlay, tags: ["secrets", "overlay"] }
    - { role: deploy, tags: ["deploy"] }
    - { role: smoketest, tags: ["smoketest"] }
