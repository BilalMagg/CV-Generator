# Backend microservices compose
# All addresses reference root .env variables for multi-VM deployment

services:
  # ── Kafka (KRaft) ────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: cv-kafka
    ports:
      - "${KAFKA_PORT:-9092}:${KAFKA_PORT:-9092}"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${KAFKA_HOST:-kafka}:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST:-kafka}:${KAFKA_PORT:-9092}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_PORT:-9092},CONTROLLER://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_HEAP_OPTS: '-Xmx512m -Xms256m'
      KAFKA_JVM_PERFORMANCE_OPTS: '-XX:+UseG1GC -XX:MaxGCPauseMillis=20'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:${KAFKA_PORT:-9092} --list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - cv-network

  # ── Kafka UI ─────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cv-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cv-backend
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_HOST:-kafka}:${KAFKA_PORT:-9092}
    depends_on:
      - kafka
    networks:
      - cv-network

  # ── User Service ─────────────────────────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: ./src/user-service/Dockerfile
    container_name: cv-user-service
    ports:
      - "${USER_SERVICE_PORT:-8082}:${USER_SERVICE_PORT:-8082}"
      - "${USER_SERVICE_GRPC_PORT:-18082}:${USER_SERVICE_GRPC_PORT:-18082}"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PORT=${USER_SERVICE_PORT:-8082}
      - GRPC_PORT=${USER_SERVICE_GRPC_PORT:-18082}
      - ConnectionStrings__DefaultConnection=Host=${USER_DB_HOST:-user-db};Port=${USER_DB_PORT:-5432};Database=user_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - JWT_AUTHORITY=http://${KEYCLOAK_HOST:-keycloak}:${KEYCLOAK_PORT:-8080}/realms/cv-realm
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_HOST:-kafka}:${KAFKA_PORT:-9092}
    depends_on:
      user-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks:
      - cv-network

  # ── User Content Service ─────────────────────────────────────────────────────
  user-content-service:
    build:
      context: .
      dockerfile: ./src/user-content-service/Dockerfile
    container_name: cv-user-content-service
    ports:
      - "${CONTENT_SERVICE_PORT:-8083}:${CONTENT_SERVICE_PORT:-8083}"
      - "${CONTENT_SERVICE_GRPC_PORT:-18083}:${CONTENT_SERVICE_GRPC_PORT:-18083}"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PORT=${CONTENT_SERVICE_PORT:-8083}
      - GRPC_PORT=${CONTENT_SERVICE_GRPC_PORT:-18083}
      - ConnectionStrings__DefaultConnection=Host=${CONTENT_DB_HOST:-content-db};Port=${CONTENT_DB_PORT:-5432};Database=content_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Kafka__BootstrapServers=${KAFKA_HOST:-kafka}:${KAFKA_PORT:-9092}
    depends_on:
      content-db: { condition: service_healthy }
      kafka: { condition: service_started }
    networks:
      - cv-network

  # ── Workflow Service ─────────────────────────────────────────────────────────
  workflow-service:
    build:
      context: .
      dockerfile: ./src/workflow-service/Dockerfile
    container_name: cv-workflow-service
    ports:
      - "${WORKFLOW_SERVICE_PORT:-8084}:${WORKFLOW_SERVICE_PORT:-8084}"
      - "${WORKFLOW_SERVICE_GRPC_PORT:-18084}:${WORKFLOW_SERVICE_GRPC_PORT:-18084}"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PORT=${WORKFLOW_SERVICE_PORT:-8084}
      - GRPC_PORT=${WORKFLOW_SERVICE_GRPC_PORT:-18084}
      - ConnectionStrings__DefaultConnection=Host=${WORKFLOW_DB_HOST:-workflow-db};Port=${WORKFLOW_DB_PORT:-5432};Database=workflow_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - JOB_EXTRACTOR_URL=http://${JOB_EXTRACTOR_HOST:-cv-job-extractor}:${JOB_EXTRACTOR_PORT:-8001}/api/v1/
      - SEARCH_AGENT_URL=http://${SEARCH_AGENT_HOST:-cv-search-agent}:${SEARCH_AGENT_PORT:-8002}/api/v1/
      - TEMPLATE_AGENT_URL=http://${TEMPLATE_AGENT_HOST:-cv-template-agent}:${TEMPLATE_AGENT_PORT:-8003}/api/v1/
      - CV_OPTIMIZER_URL=http://${CV_OPTIMIZER_HOST:-cv-optimizer}:${CV_OPTIMIZER_PORT:-8004}/api/v1/
      - CONTACT_AGENT_URL=http://${CONTACT_AGENT_HOST:-cv-contact-agent}:${CONTACT_AGENT_PORT:-8005}/api/v1/
      - Kafka__BootstrapServers=${KAFKA_HOST:-kafka}:${KAFKA_PORT:-9092}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      workflow-db: { condition: service_healthy }
      kafka: { condition: service_started }
    networks:
      - cv-network

  # ── Application Service ──────────────────────────────────────────────────────
  application-service:
    build:
      context: .
      dockerfile: ./src/application-service/Dockerfile
    container_name: cv-application-service
    ports:
      - "${APPLICATION_SERVICE_PORT:-8085}:${APPLICATION_SERVICE_PORT:-8085}"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PORT=${APPLICATION_SERVICE_PORT:-8085}
      - GRPC_PORT=${APPLICATION_SERVICE_GRPC_PORT:-18085}
      - ConnectionStrings__DefaultConnection=Host=${APPLICATION_DB_HOST:-application-db};Port=${APPLICATION_DB_PORT:-5432};Database=application_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_HOST:-kafka}:${KAFKA_PORT:-9092}
      - JWT_AUTHORITY=http://${KEYCLOAK_HOST:-keycloak}:${KEYCLOAK_PORT:-8080}/realms/cv-realm
      - USER_SERVICE_GRPC_URL=http://${USER_SERVICE_HOST:-cv-user-service}:${USER_SERVICE_GRPC_PORT:-18082}
    depends_on:
      application-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks:
      - cv-network

  # ── Job Offer Service ────────────────────────────────────────────────────────
  job-offer-service:
    build:
      context: .
      dockerfile: ./src/job-offer-service/Dockerfile
    container_name: cv-job-offer-service
    ports:
      - "${JOB_OFFER_SERVICE_PORT:-8086}:${JOB_OFFER_SERVICE_PORT:-8086}"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PORT=${JOB_OFFER_SERVICE_PORT:-8086}
      - ConnectionStrings__DefaultConnection=Host=${JOB_OFFER_DB_HOST:-job-offer-db};Port=${JOB_OFFER_DB_PORT:-5432};Database=job_offer_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      job-offer-db: { condition: service_healthy }
    networks:
      - cv-network

  # ── Notification Service ─────────────────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: ./src/notification-service/Dockerfile
    container_name: cv-notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8087}:${NOTIFICATION_SERVICE_PORT:-8087}"
    env_file:
      - ./src/notification-service/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PORT=${NOTIFICATION_SERVICE_PORT:-8087}
      - ConnectionStrings__DefaultConnection=Host=${NOTIFICATION_DB_HOST:-notification-db};Port=${NOTIFICATION_DB_PORT:-5432};Database=notification_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Kafka__BootstrapServers=${KAFKA_HOST:-kafka}:${KAFKA_PORT:-9092}
      - USER_SERVICE_GRPC_URL=http://${USER_SERVICE_HOST:-cv-user-service}:${USER_SERVICE_GRPC_PORT:-18082}
      - APPLICATION_SERVICE_GRPC_URL=http://${APPLICATION_SERVICE_HOST:-cv-application-service}:${APPLICATION_SERVICE_GRPC_PORT:-18085}
    depends_on:
      notification-db: { condition: service_healthy }
    networks:
      - cv-network

  # ── CV Service ───────────────────────────────────────────────────────────────
  cv-service:
    build:
      context: .
      dockerfile: ./src/cv-service/Dockerfile
    container_name: cv-cv-service
    ports:
      - "${CV_SERVICE_PORT:-8088}:${CV_SERVICE_PORT:-8088}"
      - "${CV_SERVICE_GRPC_PORT:-18088}:${CV_SERVICE_GRPC_PORT:-18088}"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - PORT=${CV_SERVICE_PORT:-8088}
      - GRPC_PORT=${CV_SERVICE_GRPC_PORT:-18088}
      - ConnectionStrings__DefaultConnection=Host=${CV_DB_HOST:-cv-db};Port=${CV_DB_PORT:-5432};Database=cv_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - JWT_AUTHORITY=http://${KEYCLOAK_HOST:-keycloak}:${KEYCLOAK_PORT:-8080}/realms/cv-realm
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_HOST:-kafka}:${KAFKA_PORT:-9092}
    depends_on:
      cv-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks:
      - cv-network

  # ── MinIO (Object Storage for CVs) ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: cv-minio
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    ports:
      - "${MINIO_PORT:-9000}:${MINIO_PORT:-9000}"
      - "${MINIO_CONSOLE_PORT:-9001}:${MINIO_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cv-network

  # ── Databases ───────────────────────────────────────────────────────────────
  user-db:
    image: pgvector/pgvector:pg16
    container_name: cv-user-db
    ports:
      - "${USER_DB_EXT_PORT:-5433}:${USER_DB_PORT:-5432}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: user_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - cv-network

  content-db:
    image: pgvector/pgvector:pg16
    container_name: cv-content-db
    ports:
      - "${CONTENT_DB_EXT_PORT:-5434}:${CONTENT_DB_PORT:-5432}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: content_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d content_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - content_db_data:/var/lib/postgresql/data
    networks:
      - cv-network

  workflow-db:
    image: pgvector/pgvector:pg16
    container_name: cv-workflow-db
    ports:
      - "${WORKFLOW_DB_EXT_PORT:-5435}:${WORKFLOW_DB_PORT:-5432}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: workflow_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d workflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - workflow_db_data:/var/lib/postgresql/data
    networks:
      - cv-network

  application-db:
    image: pgvector/pgvector:pg16
    container_name: cv-application-db
    ports:
      - "${APPLICATION_DB_EXT_PORT:-5436}:${APPLICATION_DB_PORT:-5432}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: application_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d application_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - application_db_data:/var/lib/postgresql/data
    networks:
      - cv-network

  job-offer-db:
    image: pgvector/pgvector:pg16
    container_name: cv-job-offer-db
    ports:
      - "${JOB_OFFER_DB_EXT_PORT:-5437}:${JOB_OFFER_DB_PORT:-5432}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: job_offer_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d job_offer_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - job_offer_db_data:/var/lib/postgresql/data
    networks:
      - cv-network

  notification-db:
    image: pgvector/pgvector:pg16
    container_name: cv-notification-db
    ports:
      - "${NOTIFICATION_DB_EXT_PORT:-5438}:${NOTIFICATION_DB_PORT:-5432}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: notification_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    networks:
      - cv-network

  cv-db:
    image: pgvector/pgvector:pg16
    container_name: cv-cv-db
    ports:
      - "${CV_DB_EXT_PORT:-5439}:${CV_DB_PORT:-5432}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: cv_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d cv_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - cv_db_data:/var/lib/postgresql/data
    networks:
      - cv-network

volumes:
  kafka_data:
  user_db_data:
  content_db_data:
  workflow_db_data:
  application_db_data:
  job_offer_db_data:
  notification_db_data:
  cv_db_data:
  minio_data:

networks:
  cv-network:
    name: ${CV_NETWORK:-cv-network}
