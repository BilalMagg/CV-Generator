name: cv

include:
  - path: ./backend/docker-compose.yml
  - path: ./ai_agents/docker-compose.yml
  - path: ./api_gateway/docker-compose.yml

services:

  # ── Template agent ordering ──────────────────────────────────────────────────
  # Merges with the definition in ai_agents/docker-compose.yml. The template
  # agent seeds default CV templates into MinIO at startup, so it must wait for
  # MinIO (defined in backend/docker-compose.yml) to be healthy first. This stub
  # lives only here — adding it to the ai_agents file would break running that
  # compose standalone (where `minio` is not defined).
  template-agent:
    depends_on:
      minio:
        condition: service_healthy

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: cv-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    environment:
      - GATEWAY_HOST=${GATEWAY_HOST:-cv-api-gateway}
      - GATEWAY_PORT=${GATEWAY_PORT:-8080}
      - FRONTEND_HOST=${FRONTEND_HOST:-localhost}
      - FRONTEND_PORT=${FRONTEND_PORT:-4200}
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - cv-network

networks:
  cv-network:
    name: ${CV_NETWORK:-cv-network}
